name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # `--ignore-scripts` blocks dependency lifecycle scripts (supply-chain hygiene).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Generates the two git-ignored asset sets the site serves from its own origin:
      #   fonts/                webfont slices, assembled from @fontsource-variable/*
      #   js/vendor/three*.js   the three.js bundle, built from the npm `three` package
      # Both must exist before the upload, because a fresh checkout contains neither.
      - name: Build generated assets (fonts + three.js)
        run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name rolin-shmily
