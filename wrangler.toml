name = "rolin-shmily"
compatibility_date = "2024-09-23"
main = "worker/index.ts"
route = "www.srprolin.top/*"

# Assets are matched before the Worker runs. `run_worker_first = ["/api/*"]` lived here
# and was removed along with the only API route that needed it; no path now invokes the
# Worker ahead of a file lookup. Note that `directory = "."` means .assetsignore — never
# .gitignore — decides what is published.
[assets]
directory = "."
binding = "ASSETS"
