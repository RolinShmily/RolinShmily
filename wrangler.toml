name = "rolin-shmily"
compatibility_date = "2024-09-23"
route = "www.srprolin.top/*"

# Assets-only Worker. There is no `main` script and no asset binding, because nothing
# dynamic is left to run: the site is static files, and the last script route
# (`/api/github/*`) was deleted in fdd5717. Both omissions are required rather than
# stylistic — wrangler rejects `binding = "ASSETS"` when there is no script to consume it
# ("Cannot use assets with a binding in an assets-only Worker").
#
# `directory = "."` means .assetsignore — never .gitignore — decides what is published.
# See .assetsignore for why that distinction matters.
[assets]
directory = "."
